name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "example key"
      NEXT_PUBLIC_SUPABASE_URL: "example url"
      SUPABASE_SECRET_KEY: "example secret"
      SUPABASE_URL: "example url"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Check pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test

      - name: Build (next build)
        run: pnpm build
